# llm_features_pipeline - binary ransomware vs goodware from opcode text.
#
# Everything downstream is BINARY: label 0 = goodware / benign,
# label 1 = ransomware. Both upstream repos were built for multi-class work
# (Adversarial_Evaluation_CNN-ViT on BIG 2015's 9 families; the Tokenization
# repo's `New/` tree on the same) and the family name in a ransomware filename
# is kept ONLY as a split group, never as a target. See README.md.

paths:
  # Tokenization-Testing-for-Malware-Data checkout. Its Tokenization/,
  # Embedding/ and Classification/ modules are imported, not copied, so a fix
  # there reaches this pipeline without a second code path.
  tokenization_repo: "C:/Users/chaoa/Downloads/Tokenization-Testing-for-Malware-Data"
  # extract.py output for the Mendeley corpora (ransomware + Mendeley goodware).
  llm_features: "C:/Users/chaoa/Downloads/LLM_Features/Features_Extraction"
  # asm_to_opcodes.py output for Goodware_Balanced.
  balanced_goodware: "C:/Users/chaoa/Downloads/LLM_Features_Balanced/good_all"
  balanced_manifest: "C:/Users/chaoa/Downloads/LLM_Features_Balanced/opcode_manifest.csv"
  # --- REVISED feature variant -------------------------------------------
  # asm_tool/mn_to_features.py output, built from extract_unified.py
  # (capstone skip-data sweep, uncapped) instead of extract.py's linear sweep.
  # Lines are MNEMONICS ONLY ("mov"), not full instructions ("mov eax, ebx"),
  # and the cohort filter is already applied, so these folders contain exactly
  # the `in_cohort == 1` rows of cohort_mendeley.csv / cohort_balanced.csv.
  # Same `<family>_<filename>.txt` naming, same folder layout.
  llm_features_revised: "C:/Users/chaoa/Downloads/LLM_Features_Revised/Features_Extraction"
  revised_manifest: "C:/Users/chaoa/Downloads/LLM_Features_Revised/Features_Extraction/revised_manifest.csv"
  balanced_goodware_revised: "C:/Users/chaoa/Downloads/LLM_Features_Revised_Balanced/good_all"
  balanced_revised_manifest: "C:/Users/chaoa/Downloads/LLM_Features_Revised_Balanced/revised_manifest.csv"
  # --- cohort definitions -------------------------------------------------
  # One row per input binary, kept or not, with the ARCHITECTURE of every file
  # of every set. This is the first source in the project that has arch for
  # `good_test` and for the ransomware side, so the per-architecture breakdown
  # the earlier audit had to leave open is now computable for all six
  # experiments. Joined on `<family>_<filename>.txt`; see data.Cohort.
  cohort_mendeley: "C:/Users/chaoa/Downloads/asm and mm/Shared/cohort_mendeley.csv"
  cohort_balanced: "C:/Users/chaoa/Downloads/asm and mm/Shared/cohort_balanced.csv"
  # sha256 of every Mendeley goodware binary, for the cross-source dedup guard.
  mendeley_goodware_sha256: "C:/Users/chaoa/Downloads/LLM_Features_Balanced/mendeley_goodware_sha256.json"
  results: "results"

tokenization:
  max_instructions: 5000      # matches Tokenization/tokenization.py
  vocab_size: 1000
  methods: ["WPC", "SW", "WP"]
  # Trained WordPiece tokenizers are cached here and reused whenever the
  # training corpus is byte-identical. This is the only way to make a WPC run
  # reproducible: the `tokenizers` trainer picks a different vocabulary at the
  # size cutoff in every process (Rust HashMap iteration order), which moved
  # RF/WPC macro-F1 by 0.06 between two runs of the identical command.
  # See run_pipeline.get_tokenizer() and docs/tokenization_audit.md §1.10.
  # Delete the directory to force a retrain.
  tokenizer_cache: "results/tokenizers"

embedding:
  methods: ["w2v"]            # add "bert" for the DistilBERT/SW combo (slow on CPU)
  w2v:
    vector_size: 100
    window: 30
    epochs: 5
    seed: 42
    # MUST stay 1. gensim's default (workers=4) races its worker threads over
    # the corpus, so a fixed seed does NOT give a fixed model and results/
    # cannot be reproduced. Measured: identical at workers=1, differing by up
    # to 3.8e-2 per component at workers=4.
    workers: 1
  mask_rates: [0.0]           # [0.0, 0.15, 0.40, 0.80] reproduces the original sweep

classification:
  models: ["RF", "SVM-RBF", "MLP"]
  cv: 2
  seed: 42

split:
  # The ransomware train/test boundary is FAMILY-DISJOINT in the Mendeley
  # release (25 families in mal_train, 15 different ones in mal_test, zero
  # overlap). It is reused verbatim and identically in every experiment.
  # Re-splitting at random would put avaddon in both sides and turn the task
  # into near-duplicate retrieval.
  ransomware: "preserve_mendeley"
  # Goodware_Balanced has no such boundary, so one is built: whole source
  # projects go to one side only, never split across train and test.
  goodware_group_field: "entry_id"
  goodware_ungrouped_entries: ["system_local"]   # per-file groups; see data.py
  # Enforced at load time, not assumed: any Goodware_Balanced file whose source
  # binary sha256 is in the Mendeley goodware set, or whose opcode stream is
  # byte-identical to a Mendeley goodware feature file, is dropped from the
  # Exp B pool and named in the run log.
  dedup_goodware_sources: true
  seed: 42
  # Match Exp A's goodware counts exactly so A vs B measures the goodware
  # SOURCE and not the goodware VOLUME. null = use everything available.
  match_counts_to: "expA"

experiments:
  expA:
    description: "Mendeley ransomware + Mendeley goodware (the LLM_Features baseline)"
    ransomware: mendeley
    goodware: mendeley
  expB:
    description: "Mendeley ransomware + Goodware_Balanced (hard-negative-rich goodware)"
    ransomware: mendeley
    goodware: balanced

  # --- the four added experiments ----------------------------------------
  #
  # Two variables are being separated, and they were previously confounded:
  #
  #   SAMPLE SET   traditional corpus as shipped  ->  cohort-filtered
  #                (drops .NET, entropy-packed, UPX-unrecoverable, no-code,
  #                 odd-arch, broken and duplicate rows, and the thanos family)
  #   FEATURE FORM full instruction per line      ->  mnemonic only
  #                (extract.py linear sweep       ->  extract_unified.py
  #                 skip-data sweep, uncapped)
  #
  # A vs A_cohort and B vs B_cohort move ONLY the sample set.
  # A_cohort vs C and B_cohort vs D move ONLY the feature form (the REVISED
  # folders are already exactly the cohort, so nothing else changes).
  # A vs C and B vs D move both at once - the comparison that was on the table
  # before these four existed.
  #
  # `cohort_filter: true` applies the filter to a TRADITIONAL corpus. The
  # revised corpora do not set it: they are pre-filtered, and asking for it
  # again would be a no-op that hides where the filtering happened.
  #
  # `reuse_goodware_split: expB` takes Exp B's committed goodware membership
  # from results/expB/splits.csv verbatim instead of re-running group_split.
  # Re-splitting a pool the cohort filter has changed would move whole source
  # projects across the train/test line, so B_cohort and D would differ from B
  # for two reasons at once. See data.reuse_split.
  expA_cohort:
    description: "Exp A restricted to the cohort (traditional features, same folders as the split)"
    ransomware: mendeley
    goodware: mendeley
    cohort_filter: true
  expB_cohort:
    description: "Exp B restricted to the cohort (traditional features, Exp B's own goodware split membership)"
    ransomware: mendeley
    goodware: balanced
    cohort_filter: true
    reuse_goodware_split: expB
  expC:
    description: "REVISED Mendeley ransomware + REVISED Mendeley goodware (mnemonic-only features)"
    ransomware: mendeley_revised
    goodware: mendeley_revised
  expD:
    description: "REVISED Mendeley ransomware + REVISED Goodware_Balanced, Exp B's goodware split membership"
    ransomware: mendeley_revised
    goodware: balanced_revised
    reuse_goodware_split: expB
