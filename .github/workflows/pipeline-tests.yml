name: pipeline-tests

# The tests of CT_GAT/pipeline that need neither the CFG caches of the author's machine nor a GPU. The tests marked
# real_data and gpu run where the data and CUDA are (see CT_GAT/pipeline/README.md). torch_geometric is not installed on
# purpose: the guards of experiments/team_pipelines are part of what is tested.

on:
  push:
    paths:
      - 'CT_GAT/pipeline/**'
      - '.github/workflows/pipeline-tests.yml'
  pull_request:
    paths:
      - 'CT_GAT/pipeline/**'
      - '.github/workflows/pipeline-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CT_GAT/pipeline
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      GT_DATASETS: /nonexistent/datasets.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CT_GAT/pipeline/requirements.txt
      - name: Install the requirements (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pytest -m "not real_data and not gpu"
        run: python -m pytest -m "not real_data and not gpu" -q -p no:cacheprovider
