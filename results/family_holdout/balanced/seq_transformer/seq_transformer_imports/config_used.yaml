name: "seq_transformer"
pipeline: "seq_transformer"
model:
  emb_dim: 64
  dim: 256
  depth: 6
  heads: 8
  mlp_dim: 512
  dropout: 0.25
  drop_path_rate: 0.0
  pooling: "masked_mean"
  mil: "mean_logits"
  positional_encoding: "learned_relative_bias_from_RobustRelativeAttention"
windows:
  window: 4096
  n_windows: 16
vocabulary:
  min_count: 1
  fit_on: "training_folds_only"
sampler:
  arch_balanced: true
imports:
  enabled: true
  hash_dim: 2048
pretrain:
  enabled: true
  checkpoint: "C:/Users/chaoa/Downloads/seq_models/pretrained.pt"
  note: "transductive_unlabelled_pass_over_both_corpora"
training:
  batch_size: 24
  eval_batch_size: 24
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 1
  max_epochs: 12
  patience: 3
  grad_clip: 1.0
  label_smoothing: 0.0
  num_workers: 6
  eval_workers: 2
  samples_per_epoch: 1000
  amp_dtype: "bfloat16"
evaluation:
  decision: "argmax_0.5"
  seed_aggregation: "mean_of_scores"
