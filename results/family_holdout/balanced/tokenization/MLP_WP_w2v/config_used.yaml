pipeline: tokenization
model: MLP_WP_w2v
source: llm_features_pipeline/config.yaml, experiment expD (pre-registered; not a
  tuned pick)
features:
  input: LLM_Features_Revised ransomware + LLM_Features_Revised_Balanced goodware
  max_instructions: 5000
  normalize: Tokenization.tokenization.normalize_instruction
  empty_files_kept_as_UNK: 0
tokenizer:
  method: WP
  vocab_size: 1000
  fit_on: training folds only
  cache: results\family_holdout\tokenizers
embedding:
  method: w2v
  vector_size: 100
  window: 30
  epochs: 5
  seed: 42
  workers: 1
  min_count: 1
  fit_on: training folds only
classifier:
  name: MLP
  kfold:
    selection: run_pipeline.fit_and_score GridSearchCV, cv=StratifiedKFold(2, shuffle=True,
      random_state=42), scoring=f1_macro
    best_params_per_fold:
      '0':
        hidden_layer_sizes: (500,)
        learning_rate_init: '0.001'
      '1':
        hidden_layer_sizes: (500,)
        learning_rate_init: '0.001'
      '2':
        hidden_layer_sizes: (500,)
        learning_rate_init: '0.001'
      '3':
        hidden_layer_sizes: (500,)
        learning_rate_init: '0.001'
      '4':
        hidden_layer_sizes: (500,)
        learning_rate_init: '0.001'
  lofo:
    selection: FIXED to the committed results/expD/metrics.json best_params - the
      per-fold grid does not fit the compute budget
    params:
      hidden_layer_sizes:
      - 500
      learning_rate_init: 0.001
lofo_unsupervised_state: reused from the K-fold fold that contains the held-out family;
  that state was fit on the other four folds and never saw the family
decision: argmax (the estimator's own predict)
seed: 42
