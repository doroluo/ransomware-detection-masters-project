pipeline: tfidf
model: mnemonic_tfidf_1_3+LinearSVC
source: rules_pipeline/train_eval.py section (c), calibration baseline (pre-registered;
  not the tuned pick)
features:
  input: Shared/Extract*/mn_opclass/<sha256>.txt (rewritten stream, asm_tool/rewrite_streams.py)
  stream: mn_opclass
  max_mnemonics: 30000
  vectoriser: TfidfVectorizer(analyzer=word, token_pattern=\S+, ngram_range=(1, 3),
    min_df=5, sublinear_tf=True, max_features=300000)
  fit_on: training rows of each fold / each LOFO train set only
  n_features_per_kfold:
    kfold_0: 232705
    kfold_1: 257018
    kfold_2: 242895
    kfold_3: 238973
    kfold_4: 247265
classifier:
  name: LinearSVC
  estimator: LinearSVC(random_state=42, max_iter=5000)
  class_weight: null
  C_grid:
  - 0.1
  - 1
  - 10
  C_selection: GridSearchCV(cv=StratifiedKFold(2, shuffle=True, random_state=42),
    scoring=f1_macro) inside the training rows
  C_chosen:
    kfold:
      '0':
        C: 10
        cv_f1_macro: 0.985
