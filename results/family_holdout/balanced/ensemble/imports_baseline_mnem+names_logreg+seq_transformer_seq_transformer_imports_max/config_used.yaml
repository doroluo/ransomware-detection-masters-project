pipeline: ensemble
model: imports_baseline_mnem+names_logreg+seq_transformer_seq_transformer_imports_max
members:
- pipeline: imports_baseline
  model: mnem+names_LogReg
  source: results/family_holdout/balanced/imports_baseline/mnem+names_LogReg/{predictions,lofo_predictions}.csv
  score: seed-mean P(ransomware), 3 seeds K-fold / 1 seed LOFO
- pipeline: seq_transformer
  model: seq_transformer_imports
  source: results/family_holdout/balanced/seq_transformer/seq_transformer_imports/{predictions,lofo_predictions}.csv
  score: seed-mean P(ransomware), 3 seeds K-fold / 1 seed LOFO
rule: max
rule_definition: score = max of member P(ransomware)
decision: score >= 0.5 (fixed; no threshold fitted anywhere)
primary: false
pre_registered: true
trained: false
oracle_kfold:
  disagreement_rate: 0.058778
  n_disagree: 153
  oracle_recall_ransomware: 0.961295
  oracle_recall_goodware: 0.986537
  member_recall_ransomware:
  - 0.943128
  - 0.946288
  member_recall_goodware:
  - 0.979806
  - 0.910247
  note: oracle = a per-file choice of whichever member is right; an upper bound on
    any combination rule, not a result
schemes:
- kfold
- lofo
