pipeline: stacker
model: tfidf_logreg+seq_transformer_seq_transformer_imports_logitlr
members:
- pipeline: tfidf
  model: LogReg
- pipeline: seq_transformer
  model: seq_transformer_imports
combiner: LogisticRegression(C=1) over [logit(p_member1), logit(p_member2)], decision
  0.5
protocol:
  kfold: fit on the other four folds' held-out member scores, apply to the held-out
    fold
  lofo: fit on the K-fold held-out scores of every file outside the family, apply
    to the family's LOFO member scores
  caveat: 'cross-validated stacking: the combiner''s training rows carry member scores
    from models whose training data included the test fold; members were not retrained
    per outer fold'
